[package]
name = "health-record"
version = "0.1.0"
description = "On-chain metadata: owner, IPFS CID, timestamp"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "health_record"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
